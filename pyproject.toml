[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lbyr"
version = "0.1.0"
description = "Look Before You Retry: edge-native modular VLA with an async visual grasp-verification Critic"
readme = "README.md"
requires-python = ">=3.10"
# Core must stay installable on a plain laptop (mock mode + tests).
dependencies = [
    "numpy>=1.22",
    "pyyaml>=6.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Jetson Orin (JetPack 6). The following come from JetPack / source builds and are
# deliberately NOT listed here, because pip would pull PyPI wheels that shadow the
# CUDA-enabled builds:
#   - torch / torchvision   (NVIDIA Jetson wheels)
#   - opencv (cv2)          (JetPack CUDA build)
#   - pyrealsense2          (librealsense source build)
# Install those per docs/ONBOARDING_LAVISH.md, then `pip install -e .[jetson]`.
# numpy<2: JetPack's system OpenCV and the Jetson torch wheels are built against NumPy 1.x
# (NumPy 2 breaks `import cv2` with "_ARRAY_API not found"). Also see constraints-jetson.txt.
# pillow>=10: the venv uses --system-site-packages and Ubuntu's Pillow 9.0.1 lacks
# PIL.Image.Resampling (>= 9.1), which transformers needs.
jetson = [
    "ikpy>=3.3",
    "numpy<2",
    "pillow>=10",
]
# Laptop / CI only: GUI-capable OpenCV for dewarp tests and tools/. Never install on the Jetson.
laptop = [
    "opencv-python>=4.8",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["lbyr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
# CLI tools and the entry point are allowed to print; library code is not.
"tools/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
